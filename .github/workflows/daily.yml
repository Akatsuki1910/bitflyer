name: 毎朝の売買シミュレーション

on:
  schedule:
    # 21:30 UTC = 翌 06:30 JST（朝のルーティンより前に回す）
    - cron: "30 21 * * *"
  workflow_dispatch: # 手動実行もできる
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: bitflyer-main-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 価格キャッシュを引き継ぐ
        # 日足は日中変わらない。朝の取得を昼・晩で使い回して
        # CoinGecko の無料枠(レート制限)を叩きすぎないようにする
        uses: actions/cache@v6
        with:
          path: data
          key: coingecko-${{ github.run_id }}
          restore-keys: coingecko-

      - name: 依存パッケージを入れる
        run: pip install -r requirements.txt

      - name: git の名前を設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 価格・ニュース取得 → シミュレーション → ダッシュボード生成 → commit & push
        run: python src/daily.py --push

      - name: 生成物を成果物として残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: docs/
          retention-days: 7
