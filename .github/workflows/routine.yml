name: 朝昼晩の仮売買ルーティン

on:
  schedule:
    # JST 07:17 / 12:17 / 20:17 （UTC 22:17 / 03:17 / 11:17）
    # 毎時0分は GitHub Actions が混み、実測で1.5〜4.7時間遅れていたので分をずらしている
    - cron: "17 22 * * *"
    - cron: "17 3 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "どの回として記録するか"
        type: choice
        options: [manual, morning, noon, evening]
        default: manual
      dry_run:
        description: "DB に書かず push もしない（動作確認用。仮想口座は動かない）"
        type: boolean
        default: false
  # push では起動しない。コードを変えるたびに予定外の回が走り、
  # 仮想口座がスケジュール外の価格で約定して記録が汚れるため。

permissions:
  contents: write

concurrency:
  group: bitflyer-main-push
  cancel-in-progress: false

jobs:
  routine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 価格キャッシュを引き継ぐ
        # 日足は日中変わらない。朝の取得を昼・晩で使い回して
        # CoinGecko の無料枠(レート制限)を叩きすぎないようにする
        uses: actions/cache@v6
        with:
          path: data
          key: coingecko-${{ github.run_id }}
          restore-keys: coingecko-

      - name: 依存パッケージを入れる
        run: pip install -r requirements.txt

      - name: git の名前を設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: どの回かを決める
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            # 旧スケジュール(毎時0分)で起動がすでに予約された回も正しく判定する
            case "${{ github.event.schedule }}" in
              "17 22 * * *"|"0 22 * * *") echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
              "17 3 * * *"|"0 3 * * *")   echo "slot=noon"    >> "$GITHUB_OUTPUT" ;;
              "17 11 * * *"|"0 11 * * *") echo "slot=evening" >> "$GITHUB_OUTPUT" ;;
              *)                          echo "slot=manual"  >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: 情報ソース一覧を同期
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        run: python src/sources.py

      - name: 情報収集 → 仮売買(ルール27口座 + Claudeの判断) → Supabase 保存 → 採点 → commit & push
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/routine.py --slot "${{ steps.slot.outputs.slot }}" --dry-run
          else
            python src/routine.py --slot "${{ steps.slot.outputs.slot }}" --push
          fi

      - name: 生成物を成果物として残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: routine-${{ steps.slot.outputs.slot }}
          path: docs/data/
          retention-days: 14
